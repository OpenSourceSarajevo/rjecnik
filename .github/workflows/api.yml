name: Rjecnik API CI

on:
  push:
    paths:
      - apps/api/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/api.yml

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rjecnik-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SUPABASE_URL=https://ci.supabase.co -e SUPABASE_ANON_KEY=ci rjecnik-api
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
